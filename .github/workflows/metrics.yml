name: metrics

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      DARK_CSS: |
        svg { background: #0d1117; color: #c9d1d9; }
        h1, h2, h3 { color: #22d3ee; }
        footer { color: #6e7681; }
        [fill="#ebedf0"] { fill: #161b22; }
        svg[version="1.1"]:not(.calendar) { display: none !important; }
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: rolandsusans
          filename: metrics/overview.svg
          output_action: commit
          output_condition: data-changed
          committer_message: "chore(metrics): refresh overview"
          base: header, activity, repositories
          config_timezone: Europe/Riga
          extras_css: ${{ env.DARK_CSS }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: rolandsusans
          filename: metrics/languages.svg
          output_action: commit
          output_condition: data-changed
          committer_message: "chore(metrics): refresh languages"
          base: ""
          config_timezone: Europe/Riga
          extras_css: ${{ env.DARK_CSS }}
          plugin_languages: yes
          plugin_languages_details: percentage

      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: rolandsusans
          filename: metrics/calendar.svg
          output_action: commit
          output_condition: data-changed
          committer_message: "chore(metrics): refresh calendar"
          base: ""
          config_display: large
          config_timezone: Europe/Riga
          extras_css: ${{ env.DARK_CSS }}
          plugin_calendar: yes
